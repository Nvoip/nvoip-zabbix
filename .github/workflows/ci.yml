name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: sh -n Scripts/*.sh
      - name: Validate monitoring templates
        run: python3 -m unittest discover -s tests -p 'test_*.py'
